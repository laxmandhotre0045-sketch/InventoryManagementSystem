# Production-ready local stack: MySQL + Spring Boot backend + React/Nginx frontend.
#
# Usage:
#   docker compose up --build           # build & start everything
#   docker compose up -d --build        # detached
#   docker compose logs -f backend      # tail a service
#   docker compose down                 # stop (keeps DB data)
#   docker compose down -v              # stop & wipe DB data
#
# URLs (host ports chosen to avoid clashing with other stacks on the server):
#   Frontend  -> http://localhost:8090
#   Backend   -> http://localhost:8091  (Swagger UI: /swagger-ui.html) — bound to 127.0.0.1
#   MySQL     -> 127.0.0.1:3310
# All three are overridable via .env (FRONTEND_PORT / BACKEND_PORT / MYSQL_PORT).

services:
  # ---------------------------------------------------------------------------
  # MySQL database
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: inventory-mysql
    restart: unless-stopped
    # Keep MySQL's footprint small for a low-RAM host.
    command: ["--innodb-buffer-pool-size=128M", "--performance-schema=OFF"]
    mem_limit: 640m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      # Bound to localhost only — for debugging/tools, not external access.
      - "127.0.0.1:${MYSQL_PORT:-3310}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - inventory-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Spring Boot backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./Inventory-System-New
    container_name: inventory-backend
    restart: unless-stopped
    # Fixed, modest JVM heap so the backend can't balloon on a low-RAM host.
    mem_limit: 900m
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseContainerSupport"
      # ---- Environment-based configuration --------------------------------
      # Everything below is read by application.properties via ${VAR:default}.
      # Moving to a VPS means changing .env only — never Java or properties files.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${MYSQL_DATABASE}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DDL_AUTO: ${DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      # Not needed while the SPA is served same-origin behind nginx, but set it
      # if you ever call the API from a different domain.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      # API version prefix — single source of truth (see ApiVersionConfig).
      API_VERSION: ${API_VERSION:-v1}
      # In-container port (matches the Dockerfile EXPOSE/HEALTHCHECK).
      SERVER_PORT: 8080
    ports:
      # Bound to localhost only — the SPA reaches the API through nginx internally.
      - "127.0.0.1:${BACKEND_PORT:-8091}:8080"
    volumes:
      # Persist uploaded invoice files (backend writes to ./uploads/invoices).
      - backend_uploads:/app/uploads
    networks:
      - inventory-net

  # ---------------------------------------------------------------------------
  # React frontend (built and served by Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./inventory-management-system-frontend
    container_name: inventory-frontend
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    networks:
      - inventory-net

networks:
  inventory-net:
    driver: bridge

volumes:
  mysql_data:
  backend_uploads:
