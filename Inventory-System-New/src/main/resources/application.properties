spring.application.name=Inventory-System-New

# =============================================================================
# Active profile — "dev" locally, "prod" on the server.
# Override with the SPRING_PROFILES_ACTIVE environment variable.
# =============================================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =============================================================================
# API versioning (single source of truth)
# Changing api.version re-maps EVERY controller (e.g. /api/v2/...) automatically.
# =============================================================================
api.base-path=${API_BASE_PATH:/api}
api.version=${API_VERSION:v1}

# =============================================================================
# Server
# =============================================================================
server.port=${SERVER_PORT:8081}

# =============================================================================
# Datasource — every value is environment-overridable, with local defaults.
# On the VPS set DB_HOST / DB_USERNAME / DB_PASSWORD; nothing here needs editing.
# =============================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:inventory}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
# No credential default — set DB_PASSWORD in .env (compose passes it through).
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# File uploads (invoice attachments)
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:10MB}

# =============================================================================
# Security / JWT — ALWAYS override JWT_SECRET in production.
# Booting with the placeholder below under the "prod" profile is refused
# (see SecretsGuard) — a known signing key lets anyone mint an admin token.
# =============================================================================
inventory.jwt.secret=${JWT_SECRET:local-dev-only-insecure-secret-please-override}
inventory.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# =============================================================================
# Seed accounts — the built-in admin/user rows created on first boot.
# Enabled by default for local development. On a real deployment either set
# SEED_DEFAULT_USERS=false, or override the email/password below; the well-known
# demo credentials must never reach a public server.
# =============================================================================
app.seed.default-users=${SEED_DEFAULT_USERS:true}
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@inventory.com}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:admin123}
app.seed.user-email=${SEED_USER_EMAIL:user@inventory.com}
app.seed.user-password=${SEED_USER_PASSWORD:user123}

# =============================================================================
# Currency — all monetary values (unit price, purchase totals, stock value) are
# stored as plain numbers; this ISO code declares what they represent so the UI
# formats them consistently. Change it in one place to switch currency.
# =============================================================================
app.currency.code=${CURRENCY_CODE:INR}

# =============================================================================
# Invoice OCR / document-intelligence provider (pluggable).
# "mock" returns simulated data for development. When the AI/ML team adds a real
# provider (implementing InvoiceExtractionProvider), switch this to its name
# (e.g. google | azure | textract | tesseract) — no other change required.
# =============================================================================
app.invoice.ocr.provider=${INVOICE_OCR_PROVIDER:mock}

# =============================================================================
# CORS — comma-separated list of allowed origins, or "*" for any.
# Example (production): CORS_ALLOWED_ORIGINS=https://inventory.sensovibe.com
# Not needed at all when the frontend is served same-origin behind nginx.
# =============================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
