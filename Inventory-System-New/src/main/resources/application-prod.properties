# =============================================================================
# PROD profile — server / VPS deployment.
# Activated with: SPRING_PROFILES_ACTIVE=prod
#
# Nothing in this file contains a host or URL: every environment-specific value
# comes from environment variables (see docker-compose.yml / .env).
# =============================================================================

# Keep schema in sync. Switch to "validate" once you introduce Flyway migrations.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Swagger is on by default for this internal tool; set SWAGGER_ENABLED=false to hide it.
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# Restrict this to your real domain in production, e.g.
#   CORS_ALLOWED_ORIGINS=https://inventory.sensovibe.com
# (Not required when the frontend is served same-origin behind nginx.)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Don't leak stack traces to clients
server.error.include-stacktrace=never
server.error.include-message=never

# Never create the well-known demo accounts on a deployed server. Set
# SEED_DEFAULT_USERS=true together with SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD
# for the very first boot, then turn it back off.
app.seed.default-users=${SEED_DEFAULT_USERS:false}

logging.level.root=INFO
logging.level.com.company.inventory=INFO
