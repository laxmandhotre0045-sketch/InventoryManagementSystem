# =============================================================================
# DEV profile — local development (active by default).
# Activated with: SPRING_PROFILES_ACTIVE=dev  (or nothing at all)
# =============================================================================

# Let Hibernate evolve the schema while developing
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger available locally
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Permissive CORS so a Vite dev server on any port can call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

logging.level.com.company.inventory=DEBUG
