server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets on the fly.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;
    gzip_min_length 1024;

    # ---------------------------------------------------------------------
    # API reverse proxy.
    # The SPA calls a RELATIVE path (/api/v1/...), so the browser always talks
    # to this same origin — localhost today, your VPS IP/domain tomorrow — and
    # nginx forwards to the backend container. Nothing here needs to change per
    # environment, and it removes the need for CORS entirely.
    # BACKEND_HOST defaults to the compose service name "backend".
    # ---------------------------------------------------------------------
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's embedded DNS
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        client_max_body_size  25m;   # invoice uploads
    }

    # Cache fingerprinted static assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
